    <style>
        .error-container {
            text-align: center;
            padding: 50px 20px;

            color: #333;
            line-height: 1.6;

            display: inline-block;
            padding: 15px 30px;
            background-color: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .back-button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <main>
        <div class="error-container">
            <h1>エラーが発生しました</h1>
            <div class="error-message">
                <p>申し訳ございません。メール送信中にエラーが発生しました。</p>
                <p>お手数ですが、時間をおいて再度お試しいただくか、<br>
                   直接お電話にてお問い合わせください。</p>
            </div>
            <a href="index.html" class="back-button">トップページに戻る</a>
